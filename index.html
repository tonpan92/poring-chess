<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poring Land - Online Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Nunito', 'sans-serif'], display: ['Fredoka', 'sans-serif'] } } } }</script>
    <style>
        .poring-avatar { background-size: 85% !important; background-repeat: no-repeat; background-position: center !important; width: 55px; height: 55px; border-radius: 9999px; border: 3px solid rgba(255, 255, 255, 0.8); box-shadow: 0 4px 10px rgba(0,0,0,0.15); cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .poring-avatar:hover { transform: scale(1.15) translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
        .poring-avatar.locked { filter: grayscale(100%) brightness(50%); cursor: not-allowed; }
        body.theme-poring { background: linear-gradient(135deg, #fff5f7, #f3e8ff); color: #475569; }
        body.theme-poring .hero-box { background: linear-gradient(to right, #ff9ebb, #9d76c1, #818cf8); }
        body.theme-poring .accent-badge { background: #ffe4e6; color: #e11d48; border-color: #fecdd3; }
        @keyframes boxShake { 0% { transform: translate(0, 0) rotate(0deg); } 20% { transform: translate(-5px, 5px) rotate(-5deg); } 40% { transform: translate(5px, -5px) rotate(5deg); } 60% { transform: translate(-5px, -5px) rotate(-3deg); } 80% { transform: translate(5px, 5px) rotate(3deg); } 100% { transform: translate(0, 0) rotate(0deg); } }
        .box-shake { animation: boxShake 0.4s ease-in-out infinite; }
        .stop-cursor:hover { cursor: not-allowed; }
    </style>
</head>
<body id="main-body" class="theme-poring min-h-screen font-sans transition-colors duration-500">

    <header class="max-w-6xl mx-auto px-6 pt-6">
        <nav class="bg-white/80 backdrop-blur-md px-6 py-4 rounded-3xl shadow-lg flex items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-indigo-500 to-purple-600 rounded-full flex items-center justify-center text-white text-xl shadow-md animate-bounce">📊</div>
                <div>
                    <span class="font-display text-xl tracking-wide font-bold">PORING<span class="opacity-70">LAND</span></span>
                    <span class="block text-[10px] font-semibold uppercase tracking-widest text-indigo-600">Online Edition</span>
                </div>
            </div>
            <div>
                <span id="active-theme-label" class="text-xs accent-badge font-semibold px-3 py-1.5 rounded-full">✨ Biome: Poring (x1)</span>
            </div>
        </nav>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-10 space-y-8">
        <div class="hero-box relative rounded-3xl p-8 md:p-12 text-white shadow-xl overflow-hidden">
            <div class="relative z-10 max-w-2xl">
                <span class="bg-black/35 backdrop-blur-md text-xs font-semibold px-4 py-1 rounded-full uppercase tracking-widest inline-block mb-2">Online Dashboard</span>
                <h1 class="font-display text-3xl md:text-5xl font-bold mb-4 leading-tight">Poring Land Online! ⚔️</h1>
                <p class="text-white/90 text-xs md:text-sm mt-1">Game berjalan secara online menggunakan LocalStorage browser.</p>
            </div>
        </div>

        <div class="bg-white/95 backdrop-blur-md p-6 rounded-3xl shadow-lg space-y-4 text-center">
            <h3 class="font-display text-lg font-bold text-slate-800">⚔️ Arena Pertempuran Poring</h3>
            <div class="flex justify-center my-4">
                <div onclick="attackMonster()" class="w-28 h-28 bg-pink-100 border-4 border-rose-500 rounded-full flex items-center justify-center text-5xl shadow-lg cursor-pointer select-none hover:scale-105 active:scale-95 transition">🍮</div>
            </div>
            <div id="clicker-log" class="text-xs font-bold text-slate-600 bg-slate-50 p-3 rounded-2xl">Klik Poring di atas untuk menyerang dan mendapatkan EXP serta Gold!</div>
        </div>
    </main>

    <script>
        let playerLevel = parseInt(localStorage.getItem('poring_player_level')) || 1;
        let playerGold = parseInt(localStorage.getItem('poring_player_gold')) || 500;

        function attackMonster() {
            playerGold += 10;
            localStorage.setItem('poring_player_gold', playerGold);
            document.getElementById('clicker-log').innerText = `💥 Berhasil menyerang! Gold Anda saat ini: 🪙 ${playerGold}`;
        }
    </script>
</body>
</html>
